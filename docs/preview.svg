<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #ffffff; }
    .subtitle { font-weight: 500; fill: #94a3b8; }
    .card-title { font-size: 13px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 26px; font-weight: 700; fill: #f8fafc; }
    .metric-sub { font-size: 12px; font-weight: 500; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="180" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1020" cy="200" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="550" r="220" fill="#f43f5e" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Navigation Header -->
  <rect x="30" y="24" width="1140" height="64" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <!-- Logo Icon -->
  <rect x="50" y="40" width="32" height="32" rx="8" fill="url(#primaryGrad)"/>
  <path d="M 58 56 L 64 48 L 68 52 L 74 44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- App Title &amp; Subtitle -->
  <text x="94" y="55" class="font-sans title" font-size="19">TeleChurn AI</text>
  <text x="94" y="70" class="font-sans subtitle" font-size="11">Enterprise Customer Retention Intelligence • Production v2.4</text>

  <!-- Status Indicator -->
  <rect x="850" y="42" width="125" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="866" cy="56" r="4" fill="#10b981"/>
  <text x="878" y="60" class="font-sans" font-size="12" font-weight="600" fill="#34d399">98.1% ACCURACY</text>

  <!-- Author Badge -->
  <rect x="990" y="42" width="165" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1"/>
  <circle cx="1006" cy="56" r="4" fill="#818cf8"/>
  <text x="1018" y="60" class="font-sans" font-size="12" font-weight="600" fill="#c7d2fe">BY UMAR MUKTHAR</text>

  <!-- 4 Key KPI Metrics Cards -->
  <!-- KPI 1: Accuracy -->
  <g transform="translate(30, 104)">
    <rect width="268" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="32" class="font-sans card-title">Model Accuracy</text>
    <text x="20" y="66" class="font-sans metric-value">98.1%</text>
    <text x="20" y="84" class="font-sans metric-sub" fill="#10b981">▲ +2.4% over benchmark</text>
    <circle cx="230" cy="48" r="22" fill="rgba(16, 185, 129, 0.12)"/>
    <path d="M 222 48 L 228 54 L 238 42" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- KPI 2: Precision &amp; Recall -->
  <g transform="translate(321, 104)">
    <rect width="268" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="32" class="font-sans card-title">Precision / Recall</text>
    <text x="20" y="66" class="font-sans metric-value">99.7% <tspan font-size="18" fill="#64748b">/ 92.6%</tspan></text>
    <text x="20" y="84" class="font-sans metric-sub" fill="#818cf8">F1 Score: 0.960 (Balanced)</text>
    <circle cx="230" cy="48" r="22" fill="rgba(99, 102, 241, 0.12)"/>
    <path d="M 220 48 C 224 40, 236 40, 240 48 C 236 56, 224 56, 220 48 Z" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle cx="230" cy="48" r="2" fill="#6366f1"/>
  </g>

  <!-- KPI 3: Accounts Audited -->
  <g transform="translate(612, 104)">
    <rect width="268" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="32" class="font-sans card-title">Total Accounts Audited</text>
    <text x="20" y="66" class="font-sans metric-value">14,250</text>
    <text x="20" y="84" class="font-sans metric-sub" fill="#94a3b8">Active Customer Base</text>
    <circle cx="230" cy="48" r="22" fill="rgba(245, 158, 11, 0.12)"/>
    <path d="M 222 54 C 222 50, 226 48, 230 48 C 234 48, 238 50, 238 54 M 230 46 A 3 3 0 1 0 230 40 A 3 3 0 1 0 230 46" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- KPI 4: Monthly Revenue at Risk -->
  <g transform="translate(902, 104)">
    <rect width="268" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="32" class="font-sans card-title">MRR Protected / Month</text>
    <text x="20" y="66" class="font-sans metric-value" fill="#34d399">$128,400</text>
    <text x="20" y="84" class="font-sans metric-sub" fill="#34d399">▲ 84.2% Saved Retention</text>
    <circle cx="230" cy="48" r="22" fill="rgba(16, 185, 129, 0.12)"/>
    <text x="225" y="54" font-size="16" font-weight="bold" fill="#10b981">$</text>
  </g>

  <!-- Main Left Card: Live Churn Risk Simulator &amp; Prediction Gauge -->
  <g transform="translate(30, 218)">
    <rect width="559" height="428" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <text x="24" y="36" class="font-sans" font-size="16" font-weight="700" fill="#ffffff">Live Inference &amp; Risk Scoring</text>
    <text x="24" y="54" class="font-sans" font-size="12" fill="#94a3b8">Real-time random forest churn prediction engine</text>

    <!-- Risk Gauge Container -->
    <g transform="translate(180, 160)">
      <!-- Arc Background -->
      <path d="M -110 0 A 110 110 0 0 1 110 0" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="18" stroke-linecap="round"/>
      <!-- Filled Arc: 74% Churn Probability -->
      <path d="M -110 0 A 110 110 0 0 1 80 -75" fill="none" stroke="url(#gaugeGrad)" stroke-width="18" stroke-linecap="round"/>
      
      <!-- Needle Center -->
      <circle cx="0" cy="0" r="10" fill="#f43f5e"/>
      <line x1="0" y1="0" x2="65" y2="-60" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Probability Text in Gauge -->
      <text x="0" y="-15" text-anchor="middle" class="font-sans" font-size="34" font-weight="800" fill="#ffffff">74.2%</text>
      <text x="0" y="6" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#f43f5e">HIGH CHURN RISK</text>
      <text x="-110" y="24" text-anchor="middle" class="font-sans" font-size="11" fill="#10b981">0% (Safe)</text>
      <text x="110" y="24" text-anchor="middle" class="font-sans" font-size="11" fill="#ef4444">100% (Critical)</text>
    </g>

    <!-- Simulated Customer Parameters -->
    <g transform="translate(24, 210)">
      <rect width="511" height="114" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      
      <!-- Param 1 -->
      <text x="18" y="28" class="font-sans" font-size="11" fill="#64748b">CONTRACT TYPE</text>
      <text x="18" y="48" class="font-sans" font-size="13" font-weight="600" fill="#f8fafc">Month-to-Month</text>
      <text x="18" y="62" class="font-sans" font-size="10" fill="#ef4444">+34% Risk Weight</text>

      <!-- Param 2 -->
      <text x="145" y="28" class="font-sans" font-size="11" fill="#64748b">TENURE</text>
      <text x="145" y="48" class="font-sans" font-size="13" font-weight="600" fill="#f8fafc">3 Months</text>
      <text x="145" y="62" class="font-sans" font-size="10" fill="#f59e0b">New Lifecycle</text>

      <!-- Param 3 -->
      <text x="250" y="28" class="font-sans" font-size="11" fill="#64748b">MONTHLY CHARGES</text>
      <text x="250" y="48" class="font-sans" font-size="13" font-weight="600" fill="#f8fafc">$98.50/mo</text>
      <text x="250" y="62" class="font-sans" font-size="10" fill="#ef4444">Top 15% Tier</text>

      <!-- Param 4 -->
      <text x="380" y="28" class="font-sans" font-size="11" fill="#64748b">PAYMENT METHOD</text>
      <text x="380" y="48" class="font-sans" font-size="13" font-weight="600" fill="#f8fafc">Electronic Check</text>
      <text x="380" y="62" class="font-sans" font-size="10" fill="#94a3b8">Non-automated</text>

      <!-- Recommended Action Alert -->
      <rect x="18" y="74" width="475" height="28" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
      <text x="30" y="93" class="font-sans" font-size="11" font-weight="600" fill="#fda4af">⚡ Recommended Action: Dispatch 15% Annual Retention Offer + Dedicated Account Specialist Call</text>
    </g>

    <!-- Mini Bottom Feature Pipeline -->
    <g transform="translate(24, 342)">
      <rect width="511" height="66" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="18" y="24" class="font-sans" font-size="11" font-weight="600" fill="#818cf8">ML PIPELINE EXECUTION STATUS</text>
      <text x="18" y="46" class="font-sans" font-size="12" fill="#cbd5e1">1. KNN Imputer Cleaned → 2. OneHot Encoded → 3. 24 Engineered Features → 4. RF Inference [Done in 14ms]</text>
    </g>
  </g>

  <!-- Main Right Card: Top Churn Drivers &amp; Risk Distribution -->
  <g transform="translate(611, 218)">
    <rect width="559" height="428" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <text x="24" y="36" class="font-sans" font-size="16" font-weight="700" fill="#ffffff">Feature Importance &amp; Churn Drivers</text>
    <text x="24" y="54" class="font-sans" font-size="12" fill="#94a3b8">SHAP values indicating primary determinants of customer cancellation</text>

    <!-- Feature 1: Month to Month Contract -->
    <g transform="translate(24, 80)">
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">Month-to-Month Contract</text>
      <text x="470" y="16" class="font-sans" font-size="12" font-weight="700" fill="#f43f5e">0.285</text>
      <rect x="0" y="24" width="511" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <rect x="0" y="24" width="380" height="8" rx="4" fill="url(#roseGrad)"/>
    </g>

    <!-- Feature 2: Fiber Optic Internet -->
    <g transform="translate(24, 130)">
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">Fiber Optic Internet Service</text>
      <text x="470" y="16" class="font-sans" font-size="12" font-weight="700" fill="#fb7185">0.218</text>
      <rect x="0" y="24" width="511" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <rect x="0" y="24" width="310" height="8" rx="4" fill="url(#roseGrad)"/>
    </g>

    <!-- Feature 3: Low Tenure (< 6 Months) -->
    <g transform="translate(24, 180)">
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">Customer Tenure &lt; 6 Months</text>
      <text x="470" y="16" class="font-sans" font-size="12" font-weight="700" fill="#f59e0b">0.184</text>
      <rect x="0" y="24" width="511" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <rect x="0" y="24" width="260" height="8" rx="4" fill="url(#amberGrad)"/>
    </g>

    <!-- Feature 4: Electronic Check Payment -->
    <g transform="translate(24, 230)">
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">Electronic Check Payment Method</text>
      <text x="470" y="16" class="font-sans" font-size="12" font-weight="700" fill="#818cf8">0.136</text>
      <rect x="0" y="24" width="511" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <rect x="0" y="24" width="195" height="8" rx="4" fill="url(#primaryGrad)"/>
    </g>

    <!-- Feature 5: Lack of Tech Support -->
    <g transform="translate(24, 280)">
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">No Tech Support / Online Security</text>
      <text x="470" y="16" class="font-sans" font-size="12" font-weight="700" fill="#34d399">0.098</text>
      <rect x="0" y="24" width="511" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <rect x="0" y="24" width="140" height="8" rx="4" fill="url(#emeraldGrad)"/>
    </g>

    <!-- Bottom Confusion Matrix Summary Card -->
    <g transform="translate(24, 334)">
      <rect width="511" height="74" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="18" y="24" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">VALIDATION CONFUSION MATRIX</text>
      
      <!-- Mini Matrix Boxes -->
      <g transform="translate(18, 34)">
        <rect x="0" y="0" width="112" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="8" y="18" class="font-sans" font-size="11" fill="#34d399">True Neg: 1,028</text>

        <rect x="122" y="0" width="112" height="28" rx="6" fill="rgba(239, 68, 68, 0.15)"/>
        <text x="8" y="18" class="font-sans" font-size="11" fill="#f87171" transform="translate(122, 0)">False Pos: 3</text>

        <rect x="244" y="0" width="112" height="28" rx="6" fill="rgba(245, 158, 11, 0.15)"/>
        <text x="8" y="18" class="font-sans" font-size="11" fill="#fbbf24" transform="translate(244, 0)">False Neg: 28</text>

        <rect x="366" y="0" width="112" height="28" rx="6" fill="rgba(99, 102, 241, 0.15)"/>
        <text x="8" y="18" class="font-sans" font-size="11" fill="#a5b4fc" transform="translate(366, 0)">True Pos: 350</text>
      </g>
    </g>
  </g>

  <!-- Watermark Footer -->
  <text x="600" y="664" text-anchor="middle" class="font-sans" font-size="12" font-weight="500" fill="#64748b">TeleChurn AI • Designed, Engineered &amp; Deployed by UMAR MUKTHAR • All Rights Reserved</text>
</svg>